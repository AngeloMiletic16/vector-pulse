[project]
name = "vector-pulse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AngeloMiletic", email = "angelo.miletic.am@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiomqtt>=2.5.1",
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "uvicorn>=0.52.4",
]

[project.scripts]
vector-pulse = "vector_pulse:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
