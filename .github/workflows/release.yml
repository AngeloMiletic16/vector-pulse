name: Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install locked dependencies
        run: uv sync --frozen --dev

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must use semantic version format vMAJOR.MINOR.PATCH"
              exit 1
          fi

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run test suite
        run: uv run pytest -q

      - name: Verify CLI entry point
        run: uv run vectorpulse --help

      - name: Verify SDK import
        run: |
          uv run python -c \
            "from vector_pulse.sdk import VectorPulseClient; print(VectorPulseClient)"

      - name: Build Python distributions
        run: uv build

      - name: Build production Docker image
        run: docker build --tag vectorpulse:release-candidate .

      - name: Upload Python distributions
        uses: actions/upload-artifact@v7
        with:
          name: vectorpulse-python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Download Python distributions
        uses: actions/download-artifact@v8
        with:
          name: vectorpulse-python-distributions
          path: dist

      - name: Resolve container image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=VectorPulse
            org.opencontainers.image.description=Async Industrial Asset Tracking and Predictive Monitoring Platform
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create \
              "${GITHUB_REF_NAME}" \
              dist/* \
              --verify-tag \
              --generate-notes \
              --title "VectorPulse ${GITHUB_REF_NAME}"